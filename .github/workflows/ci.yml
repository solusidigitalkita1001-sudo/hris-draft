name: CI

# Quality gate for pull requests and feature branches.
# Does NOT deploy — deployment stays in deploy.yml (push to main).
# Blocking steps: filename hygiene, backend type-check + build, migration
# apply-from-empty, frontend build. Soft steps (report only, flip to blocking
# once the backlog is cleared): npm audit, secret scan. Browser E2E is blocking:
# it gets a fresh database every run, so it has no cross-run flake source.

on:
  pull_request:
    branches: [main]
  push:
    # main included deliberately. deploy.yml runs no tests, so without this the
    # merged state of main is never verified as a whole — only the PR branch was.
    # NOTE: this verifies main, it does not gate the deploy: deploy.yml triggers
    # on the same push and does not wait for this workflow. Making the deploy
    # conditional on CI means editing deploy.yml, which is out of scope here.
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene (filename guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject stray duplicate/backup filenames
        run: |
          set -euo pipefail
          # macOS Finder / "Save a Copy" duplicates produce "foo 2.ts" etc.
          bad="$(git ls-files | grep -E ' [0-9]+\.(ts|tsx|js|jsx|json)$' || true)"
          copies="$(git ls-files | grep -iE '(^|/)[^/]*copy[^/]*\.(ts|tsx|js|jsx)$' || true)"
          if [ -n "$bad$copies" ]; then
            echo "::error::Suspicious duplicate/backup filenames committed:"
            printf '%s\n' "$bad" "$copies"
            exit 1
          fi
          echo "OK: no '* 2.ts' / '*copy*' files."

  mobile-release-contract:
    name: Mobile smoke + HTTPS configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deployment shell syntax
        run: bash -n scripts/server-deploy.sh
      - name: Verify the 24-operation sanitized smoke contract
        run: node scripts/checks/mobile-api-smoke.test.cjs
      - name: Verify every frontend API call hits a declared backend route (blocking)
        run: node scripts/checks/frontend-api-contract.cjs
      - name: Generate throwaway TLS files for Nginx syntax validation
        run: >-
          openssl req -x509 -nodes -newkey rsa:2048 -days 1
          -subj '/CN=localhost'
          -keyout /tmp/hris-ci-privkey.pem
          -out /tmp/hris-ci-fullchain.pem
      - name: Validate HTTPS Nginx configuration
        run: >-
          docker run --rm
          --add-host api:127.0.0.1
          --add-host api-replica:127.0.0.1
          -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          -v "$PWD/deploy/nginx-https:/etc/nginx/sites-enabled:ro"
          -v "/tmp/hris-ci-fullchain.pem:/etc/nginx/tls/fullchain.pem:ro"
          -v "/tmp/hris-ci-privkey.pem:/etc/nginx/tls/privkey.pem:ro"
          nginx:alpine nginx -t

  integration:
    name: Real-database integration suites (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # The suites refuse to run unless the host is local and the database
          # is named this, so a developer or deployment database cannot be hit
          # by accident.
          MYSQL_DATABASE: hris_payment_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      RUN_DB_INTEGRATION: "1"
      EWA_ACCESS_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_ATTENDANCE_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_CALCULATION_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_FORMULA_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_PAYMENT_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_SALARY_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
      PAYROLL_ACCESS_DB_URL: mysql://root:root@127.0.0.1:3306/hris_payment_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply migrations to the integration database
        run: npx prisma migrate deploy
      # Advisory locks, rollback, concurrent runs and row locks are behaviour a
      # mocked Prisma client cannot reproduce, so these nine suites need a real
      # database. --runInBand because they share it and clean up after
      # themselves in afterAll.
      - name: Nine gated suites against real MySQL (blocking)
        run: npx jest --runInBand "\\.mysql\\.test\\.ts$" "advisory-lock"

  backend:
    name: Backend (type-check + build [blocking], lint + test [soft])
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Type-check (blocking)
        run: npm run check
      - name: Build (blocking)
        run: npm run build
      - name: Lint (blocking — errors only; any/non-null remain warnings)
        run: npm run lint

  migrations:
    name: Migration validation + tests (migrate [blocking], test [soft])
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hris_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hris_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Create shadow database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS hris_ci_shadow;"
      - name: Apply full migration chain to empty DB (blocking)
        run: npx prisma migrate deploy
      # Blocking as of 5 Oct 2026. This is the only check that detects the
      # failure that already took production down once: a column added to
      # schema.prisma and never migrated, so Prisma SELECTs a column the
      # database does not have and every role gets a 500. Closing that drift
      # took a reconciliation migration of 16 CREATE TABLE IF NOT EXISTS.
      # Advisory, it ran and was ignored. Flipped while drift was zero, so no
      # backlog had to be cleared first.
      - name: Schema-vs-migrations drift check (blocking)
        run: >-
          npx prisma migrate diff
          --from-migrations src/database/prisma/migrations
          --to-schema-datamodel src/database/prisma/schema.prisma
          --shadow-database-url mysql://root:root@127.0.0.1:3306/hris_ci_shadow
          --exit-code
      - name: Backend tests against migrated DB (blocking)
        run: npm test

  migration-rehearsal:
    name: Migration rehearsal (soft)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hris_rehearsal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hris_rehearsal
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/hris_rehearsal_shadow
      # Seed loads @/config which exits without these; values are throwaway.
      JWT_ACCESS_SECRET: ci_rehearsal_access_secret
      JWT_REFRESH_SECRET: ci_rehearsal_refresh_secret
      SESSION_SECRET: ci_rehearsal_session_secret
      CSRF_SECRET: ci_rehearsal_csrf_secret_16+
      ENCRYPTION_KEY: ci_rehearsal_encryption_key_32_bytes_min!!
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Create shadow database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS hris_rehearsal_shadow;"
      - name: Run migration rehearsal (migrate + seed + assert)
        run: bash ../scripts/migration-rehearsal.sh

  frontend:
    name: Frontend (build + lint + test [blocking])
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (blocking)
        run: npm run build
      - name: Lint (blocking)
        run: npm run lint
      # The frontend unit suite was never run here, so it rotted until it could
      # not pass on any machine: no vitest configuration meant it collected
      # Playwright's e2e specs and rendered components outside their providers.
      # Blocking rather than soft, because soft is how it got into that state.
      - name: Test (blocking)
        run: npm test

  e2e:
    name: Browser E2E (Playwright, soft)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hris_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hris_e2e
      # Same minimums the app validates at bootstrap; throwaway values.
      JWT_ACCESS_SECRET: e2e-jwt-access-secret-0123456789
      JWT_REFRESH_SECRET: e2e-jwt-refresh-secret-0123456789
      SESSION_SECRET: e2e-session-secret-0123456789ab
      CSRF_SECRET: e2e-csrf-secret-0123456789abcd
      ENCRYPTION_KEY: e2e-encryption-key-0123456789abcdef0123
      # The suite drives HTTP, so cookies must not be Secure-only.
      COOKIE_SECURE: "false"
      # Redis/RabbitMQ/BullMQ are warn-and-continue at boot, but switching them
      # off keeps the log readable and the run deterministic.
      REDIS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      QUEUE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Prisma generate + migrate + seed
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          # The suite signs in as seeded users (maya@tech.com) and needs the
          # leave-balance allocations the seed creates for the current year.
          npm run prisma:seed
      - name: Start backend
        working-directory: backend
        run: |
          npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy"; cat /tmp/backend.log; exit 1
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          # dev, not preview: vite.config.ts proxies /api/v1 to the backend under
          # `server`, so the suite talks to one origin exactly as a developer does.
          # localhost, not 127.0.0.1: CsrfProtection checks the request Origin
          # against config.cors.origins, which defaults to http://localhost:5173.
          # A browser on 127.0.0.1 sends a different origin and every mutation
          # comes back 403 — which is exactly how the first CI run failed.
          npm run dev -- --host localhost --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::frontend dev server did not start"; cat /tmp/frontend.log; exit 1
      # Blocking, and it can be: the leftover-data flake that makes this suite
      # unreliable locally cannot happen here, because every run gets a fresh
      # MySQL service and a fresh seed. retries stay at 0 on purpose — this
      # suite exists to catch flaky session behaviour, so retrying would hide
      # the very bug it is here to find. Single worker (see
      # playwright.config.ts): all eight tests share one employee's session.
      - name: Playwright (blocking)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (soft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend npm audit (soft)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Frontend npm audit (soft)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secret-scan:
    name: Secret scan (soft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
