name: 🚀 Deploy HRIS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Debug SSH
        run: |
          echo "HOST=${{ secrets.SSH_HOST }}"
          echo "PORT=${{ secrets.SSH_PORT }}"
          echo "USER=${{ secrets.SSH_USER }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s           # SSH connection timeout (biarkan default 30s)
          command_timeout: 20m   # ← INI yang ngatur durasi script, tambahkan ini
          script: |
            set -e
            cd /root/projects/dev/hris-draft
            git fetch origin && git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            sleep 15

            echo "⏳ Waiting for backend to be ready..."
            MAX_RETRY=40
            COUNT=0
            until docker exec hris_backend curl -sf http://localhost:3000/health 2>/dev/null; do
              printf '.'
              sleep 3
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRY ]; then
                echo ""
                echo "❌ Backend not ready after $((MAX_RETRY * 3))s. Last logs:"
                docker logs hris_backend --tail 30
                exit 1
              fi
            done
            echo ""

            docker exec hris_backend npx prisma migrate deploy \
              --schema=src/database/prisma/schema.prisma 2>/dev/null || \
            docker exec hris_backend npx prisma db push \
              --schema=src/database/prisma/schema.prisma --accept-data-loss

            docker image prune -f --filter "until=24h"
            echo "✅ HRIS deployed!"
