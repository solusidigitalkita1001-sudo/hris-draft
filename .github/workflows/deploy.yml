name: 🚀 Deploy HRIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH (server-deploy.sh version-controlled)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 600s
          # All logic lives in repo scripts/server-deploy.sh (version-controlled).
          # Github Actions hanya: (1) ssh masuk; (2) git pull/reset sudah diurus server
          # (3) chmod +x script deploy; (4) exec script deploy.
          # Maintainability: gak perlu edit workflow YAML kalo mau ubah flow deploy.
          script: |
            set -euo pipefail
            cd /root/projects/dev/hris-draft
            echo "🚀 [GHA] SSH connected to ${SSH_USER}@${SSH_HOST}"
            echo "🚩 Commit will be synced from origin/main inside script"
            chmod +x ./scripts/server-deploy.sh || true
            # Override env sesuai server production disini jika perlu (opsional):
            # export COMPOSE_FILE=docker-compose.prod.yml
            # export BACKEND_CONTAINER=hris_backend
            # export DEPLOY_DIR="$PWD"
            ./scripts/server-deploy.sh
