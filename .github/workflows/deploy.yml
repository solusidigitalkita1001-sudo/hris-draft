name: 🚀 Deploy HRIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 600s
          script: |
            set -e
            cd /root/projects/dev/hris-draft

            # Backup .env
            cp backend/.env /tmp/hris-backend-env.bak
            echo "✅ .env backed up"

            git fetch origin && git reset --hard origin/main

            # Restore .env
            cp /tmp/hris-backend-env.bak backend/.env
            echo "✅ .env restored"

            # Verifikasi DATABASE_URL ada
            if ! grep -q "DATABASE_URL" backend/.env; then
              echo "❌ DATABASE_URL missing in .env!"
              exit 1
            fi
            echo "✅ DATABASE_URL present in .env"

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            sleep 20

            # Tunggu container jalan
            echo "⏳ Waiting for hris_backend container..."
            MAX_RETRY=10
            COUNT=0
            until docker exec hris_backend echo "container ready" 2>/dev/null; do
              printf '.'
              sleep 3
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRY ]; then
                echo "❌ Container not running"
                docker logs hris_backend --tail=20
                exit 1
              fi
            done
            echo ""

            # Verifikasi DATABASE_URL terbaca di dalam container
            DB_URL=$(docker exec hris_backend printenv DATABASE_URL 2>/dev/null || echo "")
            if [ -z "$DB_URL" ]; then
              echo "❌ DATABASE_URL not set in container!"
              echo "Container env vars:"
              docker exec hris_backend printenv | grep -v SECRET | grep -v PASSWORD
              exit 1
            fi
            echo "✅ DATABASE_URL set in container"

            # Test koneksi mysql-db dari container
            echo "⏳ Testing MySQL connectivity..."
            docker exec hris_backend node -e "
            const net = require('net');
            const s = net.connect(3306, 'mysql-db', () => {
              console.log('✅ mysql-db:3306 reachable');
              s.destroy();
              process.exit(0);
            });
            s.on('error', e => {
              console.log('❌ mysql-db unreachable:', e.message);
              process.exit(1);
            });
            setTimeout(() => { console.log('❌ Connection timeout'); process.exit(1); }, 5000);
            " || {
              echo "❌ Cannot reach mysql-db from hris_backend container!"
              echo "Networks:"
              docker inspect hris_backend --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}'
              exit 1
            }

            # Jalankan migration
            echo "⏳ Running Prisma migration..."
            docker exec hris_backend npx prisma migrate deploy \
              --schema=src/database/prisma/schema.prisma 2>/dev/null || \
            docker exec hris_backend npx prisma db push \
              --schema=src/database/prisma/schema.prisma --accept-data-loss

            echo "✅ Migration done"

            # Tunggu backend fully ready (opsional, tidak block deploy)
            echo "⏳ Waiting for backend health (max 60s)..."
            COUNT=0
            until docker exec hris_backend curl -sf http://localhost:3000/health 2>/dev/null; do
              printf '.'
              sleep 5
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge 12 ]; then
                echo ""
                echo "⚠️  Backend health check timeout, tapi deployment tetap lanjut"
                echo "Last logs:"
                docker logs hris_backend --tail=10
                break
              fi
            done
            echo ""

            docker image prune -f --filter "until=24h"
            echo "✅ HRIS deployed!"
