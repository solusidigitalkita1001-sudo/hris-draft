name: 🚀 Deploy HRIS

# Deploys ONLY after CI (name: "CI", .github/workflows/ci.yml) has finished
# successfully on main — never on a bare push. This is deliberate: deploy has
# no checkout/build/test step of its own, so without this gate it would ship
# whatever was pushed to main unverified.
#
# Race note: CI's own concurrency group (ci-${{ github.ref }}, text only —
# not a live expression in THIS file) cancels an in-progress run when another
# push lands on the same ref. A run that gets cancelled by a rapid follow-up
# push completes with conclusion "cancelled", not "success", so it never
# reaches the job `if:` below and never deploys. Net effect for a burst of
# pushes to main: only the CI run for the LAST push that is allowed to finish
# will trigger a deploy, and it deploys that run's head_sha (not whatever is
# at origin/main HEAD by the time it runs). This is considered acceptable —
# operators should expect "last push that finished CI wins", not "every push
# deploys".
#
# Security note: a workflow_run event fires for EVERY completed run of "CI",
# including CI runs triggered by pull_request from a fork — and a fork can
# set its own default branch to "main", which would satisfy a head_branch ==
# 'main' check on its own. `branches: [main]` below filters at the trigger
# level (first layer; it matches the triggering run's branch context, same
# as head_branch), but a same-named branch from a fork can still reach the
# trigger. The job `if:` below is the authoritative gate: it additionally
# requires the triggering CI run's event to be 'push' (fork PRs run CI under
# 'pull_request', never 'push', in this repo's ci.yml) and that the run's
# head_repository is THIS repository, not a fork. Without those two checks a
# fork-authored PR could reach the deploy job, which holds SSH_PRIVATE_KEY.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: "Commit SHA or tag to deploy instead of origin/main (manual rollback). Leave empty for a normal deploy."
        required: false
        default: ""

concurrency:
  group: hris-production-deploy
  cancel-in-progress: false

# The deploy job never calls the GitHub API and never checks out the repo
# (it deploys entirely over SSH) — it has no use for GITHUB_TOKEN.
permissions: {}

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # `on.workflow_run.branches: [main]` above already filters most noise
    # (e.g. CI runs for other branches never create a run of this job, so
    # Actions stops reporting a "skipped" run for every one of them). It
    # cannot filter on conclusion, and a same-repo branch filter alone is not
    # a security boundary (see the top-of-file security note) — so this `if:`
    # is the one place that is authoritative. All four conditions are
    # required for the workflow_run path: CI passed, CI ran on main, CI ran
    # for a 'push' (not a fork's 'pull_request'), and the head commit belongs
    # to this repository, not a fork. workflow_dispatch (the manual rollback
    # path) always passes this check — it is independent of any CI run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2

        env:
          ROLLBACK_REF: ${{ github.event.inputs.rollback_ref }}
          # Empty on workflow_dispatch (no workflow_run payload on that event).
          # On workflow_run this is the exact commit CI verified — deploy must
          # reset to THIS sha, not to whatever origin/main happens to be by
          # the time this job runs (another push could have landed since).
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          HTTPS_ENABLED: ${{ vars.HTTPS_ENABLED || 'false' }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: ROLLBACK_REF,DEPLOY_SHA,HTTPS_ENABLED

          timeout: 60s
          command_timeout: 35m

          script: |
            set -euo pipefail

            DEPLOY_DIR="/root/projects/dev/hris-draft"
            ENV_FILE="$DEPLOY_DIR/backend/.env"

            echo "=========================================="
            echo "🚀 HRIS Production Deployment"
            echo "=========================================="
            echo "👤 User : $(whoami)"
            echo "🖥️ Host : $(hostname)"
            echo "📂 Path : $DEPLOY_DIR"
            echo "=========================================="

            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              echo "❌ .git directory not found"
              exit 1
            fi

            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ backend/.env not found"
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            ENV_BACKUP="$(mktemp /tmp/hris-env.XXXXXX)"

            cleanup() {
              rm -f "$ENV_BACKUP"
            }

            trap cleanup EXIT

            cp -p "$ENV_FILE" "$ENV_BACKUP"
            echo "✅ Production .env backed up"

            # Assumes $DEPLOY_DIR is a full, non-shallow clone. Resetting to
            # DEPLOY_SHA (a commit CI validated, which may be older than the
            # current origin/main tip) or to an arbitrary ROLLBACK_REF only
            # works if that commit object is already present locally; a
            # shallow clone (git clone --depth N) would need `git fetch
            # --unshallow` first, or these resets could fail with "reference
            # is not a tree" for anything deeper than the shallow history.
            ROLLBACK_REF="${ROLLBACK_REF:-}"
            DEPLOY_SHA="${DEPLOY_SHA:-}"

            if [ -n "$ROLLBACK_REF" ]; then
              echo "🎯 MANUAL ROLLBACK requested → deploying ref: $ROLLBACK_REF"
              git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
              git reset --hard "$ROLLBACK_REF"
            elif [ -n "$DEPLOY_SHA" ]; then
              echo "🔄 Fetching origin/main..."
              git fetch --prune origin main

              echo "🔄 Resetting repository to CI-verified commit: $DEPLOY_SHA"
              git reset --hard "$DEPLOY_SHA"
            else
              echo "🔄 Fetching origin/main..."
              git fetch --prune origin main

              echo "🔄 Resetting repository..."
              git reset --hard origin/main
            fi

            CURRENT_COMMIT="$(git rev-parse HEAD)"

            echo "📌 Deploy commit:"
            echo "$CURRENT_COMMIT"

            cp -p "$ENV_BACKUP" "$ENV_FILE"
            echo "✅ Production .env restored"

            if [ ! -f "./scripts/server-deploy.sh" ]; then
              echo "❌ scripts/server-deploy.sh not found"
              exit 1
            fi

            chmod +x ./scripts/server-deploy.sh

            export DEPLOY_COMMIT="$CURRENT_COMMIT"
            export PREVIOUS_COMMIT="$PREVIOUS_COMMIT"
            export COMPOSE_ENV_FILE="$ENV_FILE"

            echo "🚀 Starting deployment..."

            if ./scripts/server-deploy.sh; then
              echo "✅ Deployment succeeded at $CURRENT_COMMIT"
            else
              echo "❌ Deployment FAILED at $CURRENT_COMMIT"

              if [ -n "$PREVIOUS_COMMIT" ] && [ "$PREVIOUS_COMMIT" != "$CURRENT_COMMIT" ] && [ -z "$ROLLBACK_REF" ]; then
                echo "⏪ Auto-rolling back CODE to previous commit: $PREVIOUS_COMMIT"
                echo "⚠️  NOTE: database migrations are NOT reverted. Rollback restores"
                echo "⚠️  application code only — schema changes must stay backward-compatible."

                git reset --hard "$PREVIOUS_COMMIT"
                cp -p "$ENV_BACKUP" "$ENV_FILE"
                export DEPLOY_COMMIT="$PREVIOUS_COMMIT"

                if ./scripts/server-deploy.sh; then
                  echo "✅ ROLLBACK OK — production restored to $PREVIOUS_COMMIT"
                else
                  echo "🚨 ROLLBACK FAILED — manual intervention required (last good: $PREVIOUS_COMMIT)"
                fi
              elif [ -n "$ROLLBACK_REF" ]; then
                echo "🚨 Manual rollback deploy of $ROLLBACK_REF failed — manual intervention required"
              else
                echo "🚨 No distinct previous commit to roll back to — production may be down"
              fi

              # Always fail the workflow so a bad deploy is visible even after a successful rollback.
              exit 1
            fi
