name: 🚀 Deploy HRIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 600s
          script: |
            set -e
            cd /root/projects/dev/hris-draft

            # Backup .env sebelum git reset agar tidak tertimpa
            cp backend/.env /tmp/hris-backend-env.bak
            echo "✅ .env backed up"

            git fetch origin && git reset --hard origin/main

            # Restore .env setelah git reset
            cp /tmp/hris-backend-env.bak backend/.env
            echo "✅ .env restored"

            # Verifikasi .env tidak kosong
            if [ ! -s backend/.env ]; then
              echo "❌ backend/.env missing or empty!"
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "⏳ Waiting for backend to start..."
            sleep 20

            # Tunggu backend merespons (terima 200 atau 503 = server sudah jalan)
            echo "⏳ Waiting for backend process to be up..."
            MAX_RETRY=20
            COUNT=0
            until docker exec hris_backend curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:3000/health 2>/dev/null | grep -qE "^(200|503)$"; do
              printf '.'
              sleep 3
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRY ]; then
                echo ""
                echo "❌ Backend process not up after $((MAX_RETRY * 3))s"
                docker logs hris_backend --tail 20
                exit 1
              fi
            done
            echo " backend process up!"

            # Tunggu DB connection ready (status 200)
            echo "⏳ Waiting for database connection..."
            MAX_RETRY=30
            COUNT=0
            until docker exec hris_backend curl -sf \
                http://localhost:3000/health 2>/dev/null; do
              printf '.'
              sleep 5
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRY ]; then
                echo ""
                echo "❌ Database not ready after $((MAX_RETRY * 5))s. Last logs:"
                docker logs hris_backend --tail 20
                exit 1
              fi
            done
            echo ""
            echo "✅ Backend fully ready (DB connected)"

            docker exec hris_backend npx prisma migrate deploy \
              --schema=src/database/prisma/schema.prisma 2>/dev/null || \
            docker exec hris_backend npx prisma db push \
              --schema=src/database/prisma/schema.prisma --accept-data-loss

            docker image prune -f --filter "until=24h"
            echo "✅ HRIS deployed!"
