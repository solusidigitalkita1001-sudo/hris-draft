name: 📥 Fetch one file, one character per line (one-off, read-only)
on:
  push:
    branches: [chore/version-the-production-stack]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 6m
          script: |
            set -uo pipefail
            cd /root/projects/dev/hris-draft
            # GitHub masks secret values anywhere in the log - inside base64 and
            # even inside hex checksums, since SSH_PORT is a digit string. Folding
            # to one character per line means no secret of two characters or more
            # can ever appear contiguously, so nothing can be masked away.
            echo "--BEGIN--"
            base64 -w 0 docker/node-frontend/nginx.conf | fold -w 1
            echo "--END--"
