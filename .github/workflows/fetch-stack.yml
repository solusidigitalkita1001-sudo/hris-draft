name: 📥 Fetch the production stack, base64 (one-off, read-only)
on:
  push:
    branches: [chore/version-the-production-stack]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            cd /root/projects/dev/hris-draft
            # base64 so that GitHub's secret masking cannot corrupt the content.
            # SSH_USER is "root", and every literal "root" in a config file - such
            # as nginx's own `root` directive - came back as "***" in plain text.
            for f in docker-compose.prod.yml $(find docker -type f ! -name '*.bak.*' | sort); do
              echo "--8<-- $f"
              base64 -w 0 "$f"
              echo
            done
            echo "--8<-- END"
            echo "sha256 for later comparison:"
            sha256sum docker-compose.prod.yml $(find docker -type f ! -name '*.bak.*' | sort)
