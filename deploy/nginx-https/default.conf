# Vhost TLS produksi — topologi NYATA docker-compose.prod.yml: satu backend
# (service `backend`) dan frontend sebagai container sendiri (service
# `frontend`, jaringan `proxy` yang sama dengan nginx). Versi lama menunjuk
# upstream api/api-replica + berkas statis /var/www/html — peninggalan compose
# dev yang tidak pernah ada di produksi, sehingga HTTPS_ENABLED=true tidak
# mungkin berfungsi.
#
# Resolver Docker + variabel menunda resolusi nama sampai request datang:
# nginx tetap boot walau backend/frontend belum siap.

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;
    server_tokens off;
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hris_backend backend:3000;
    set $hris_frontend frontend:80;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/health(?:/|$) {
        proxy_pass http://$hris_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/auth/(login|refresh) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://$hris_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$hris_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Selain API: SPA dilayani container frontend, bukan berkas statis lokal.
    location / {
        proxy_pass http://$hris_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    access_log /var/log/nginx/hris_tls_access.log;
    error_log  /var/log/nginx/hris_tls_error.log;
}
