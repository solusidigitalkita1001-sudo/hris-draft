x-api-service: &api-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    - NODE_ENV=development
    - APP_URL=http://srv540825.hstgr.cloud:8084
    - CORS_ORIGINS=http://srv540825.hstgr.cloud:8083,http://localhost:5173,http://localhost:5174,http://localhost:3000
    - DATABASE_URL=mysql://hris_user:hris_password@mysql:3306/hris_enterprise
    - REDIS_URL=redis://redis:6379/0
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_DB=0
    - RABBITMQ_ENABLED=true
    - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    - RABBITMQ_EXCHANGE=hrms.domain-events
    - RABBITMQ_QUEUE_PREFIX=hrms
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  volumes:
    - ./backend:/app
    - /app/node_modules
    - upload_data:/app/uploads
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 40s

services:
  mysql:
    image: mysql:8.0
    container_name: hris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hris_enterprise
      MYSQL_USER: hris_user
      MYSQL_PASSWORD: hris_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hris-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    <<: *api-service
    container_name: hris-api
    ports:
      - "3000:3000"

  api-replica:
    <<: *api-service
    container_name: hris-api-replica

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hris-worker
    restart: unless-stopped
    command: npm run worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://hris_user:hris_password@mysql:3306/hris_enterprise
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=hrms.domain-events
      - RABBITMQ_QUEUE_PREFIX=hrms
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - upload_data:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: hris-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites:/etc/nginx/sites-enabled
      - ./frontend/dist:/var/www/html
    depends_on:
      api:
        condition: service_healthy
      api-replica:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  upload_data:
